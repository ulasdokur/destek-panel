<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Destek Paneli · Tahta</title>
<script>try { const t = localStorage.getItem("tema"); if (t === "acik" || t === "koyu") document.documentElement.dataset.theme = t === "koyu" ? "dark" : "light"; } catch {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<link rel="stylesheet" href="stil.css">
</head>
<body>
<div id="giris" hidden>
  <form class="giris-kutu" id="giris-form">
    <img src="logo.png" alt="TAHTA" class="logo logo-acik giris-logo"><img src="logo-white.png" alt="TAHTA" class="logo logo-koyu giris-logo">
    <h1>Destek paneli</h1><p>Yetkili hesabınla giriş yap.</p>
    <label>E-posta<input type="email" id="g-eposta" autocomplete="username" placeholder="ad@tahtaapp.com" required></label>
    <label>Şifre<input type="password" id="g-sifre" autocomplete="current-password" required></label>
    <button class="birincil tam" type="submit">Giriş yap</button>
    <div class="hata-satir" id="g-hata"></div>
  </form>
</div>

<div id="uygulama" hidden>
  <aside class="yan" id="yan">
    <div class="yan-ust">
      <img src="logo.png" alt="TAHTA" class="logo logo-acik"><img src="logo-white.png" alt="TAHTA" class="logo logo-koyu">
      <span class="yan-mini">T</span><span class="yan-etiket">Destek</span>
    </div>
    <nav id="sekmeler">
      <button data-s="bugun" title="Bugün"><i data-lucide="list-checks"></i><span>Bugün</span></button>
      <button data-s="ozet" title="Özet"><i data-lucide="layout-grid"></i><span>Özet</span></button>
      <button data-s="gunluk" title="Günlük"><i data-lucide="chart-column"></i><span>Günlük</span></button>
      <button data-s="haftalik" title="Haftalık Rapor"><i data-lucide="calendar"></i><span>Haftalık Rapor</span></button>
      <div class="grup" data-grup="sikayet">
        <button class="grup-bas" title="Şikayetler" data-ilk="bekleyen"><i data-lucide="inbox"></i><span>Şikayetler</span><b class="rozet grup-rozet" id="r-sikayet-grup"></b><i data-lucide="chevron-down" class="ok"></i></button>
        <div class="grup-ic">
          <button data-s="bekleyen"><span>Bekleyenler</span><b class="rozet" id="r-bekleyen"></b></button>
          <button data-s="kontrol"><span>Haftalık Kontrol</span><b class="rozet" id="r-kontrol"></b></button>
          <button data-s="sikayet"><span>Tüm Şikayetler</span></button>
        </div>
      </div>
      <div class="grup" data-grup="ogretmen">
        <button class="grup-bas" title="Öğretmenler" data-ilk="ogretmen"><i data-lucide="graduation-cap"></i><span>Öğretmenler</span><b class="rozet grup-rozet" id="r-ogretmen-grup"></b><i data-lucide="chevron-down" class="ok"></i></button>
        <div class="grup-ic">
          <button data-s="ogretmen"><span>Öğretmen Listesi</span></button>
          <button data-s="uyari"><span>Uyarılar</span><b class="rozet" id="r-uyari"></b></button>
          <button data-s="takip"><span>Yakın Takip</span></button>
          <button data-s="denetim"><span>Rastgele Denetim</span></button>
          <button data-s="eksi"><span>Eksi Puanlılar</span></button>
          <button data-s="kesinti"><span>Hesap Kesintileri</span><b class="rozet" id="r-kesinti"></b></button>
          <button data-s="odeme"><span>Ödemeler</span><b class="rozet" id="r-odeme"></b></button>
        </div>
      </div>
      <button data-s="basvuru" title="Solver Başvuruları"><i data-lucide="award"></i><span>Solver Başvuruları</span><b class="rozet" id="r-basvuru"></b></button>
      <button data-s="ogrenci" title="Öğrenciler"><i data-lucide="users"></i><span>Öğrenciler</span></button>
      <button data-s="gonderici" title="Tebeşir" class="sadece-yonetici" hidden><i data-lucide="send"></i><span>Tebeşir</span></button>
    </nav>
    <div class="yan-alt">
      <div class="tema" role="radiogroup" aria-label="Görünüm">
        <button data-tema="sistem" title="Cihaza göre" aria-label="Cihaza göre"><i data-lucide="clock"></i></button>
        <button data-tema="acik" title="Açık" aria-label="Açık"><i data-lucide="sun"></i></button>
        <button data-tema="koyu" title="Koyu" aria-label="Koyu"><i data-lucide="moon"></i></button>
      </div>
      <div class="kullanici">
        <button class="kul-bilgi sifre-ac" title="Şifre değiştir"><span class="avatar k-bas"></span><span class="kul-ad"><b class="k-ad"></b><small class="k-rol"></small></span></button>
        <button class="cikis" title="Çıkış yap" aria-label="Çıkış yap"><i data-lucide="log-out"></i></button>
      </div>
    </div>
  </aside>

  <header class="mobil-ust">
    <img src="logo.png" alt="TAHTA" class="logo logo-acik"><img src="logo-white.png" alt="TAHTA" class="logo logo-koyu">
    <span class="bosluk"></span>
    <button class="yuvarlak" id="m-ara" aria-label="Ara"><i data-lucide="search"></i></button>
    <button class="yuvarlak zil" aria-label="Bugünün işleri"><i data-lucide="bell"></i><span class="nokta" hidden></span></button>
    <button class="avatar k-bas" id="m-hesap" aria-label="Hesap"></button>
  </header>

  <main id="ana">
    <div class="ust-arac" id="ust-arac">
      <div class="ara-kutu">
        <i data-lucide="search"></i>
        <input id="ara" type="search" placeholder="Şikayet, öğretmen ya da öğrenci ara" autocomplete="off">
        <kbd>⌘K</kbd>
        <div class="ara-sonuc" id="ara-sonuc" hidden></div>
      </div>
      <button class="yuvarlak zil" aria-label="Bugünün işleri" title="Bugünün işleri"><i data-lucide="bell"></i><span class="nokta" hidden></span></button>
    </div>
    <div id="icerik"></div>
  </main>

  <nav class="alt-menu" id="alt-menu">
    <button data-s="bugun"><i data-lucide="list-checks"></i>Bugün</button>
    <button data-s="bekleyen" data-grup="sikayet"><i data-lucide="inbox"></i>Şikayetler</button>
    <button data-s="ogretmen" data-grup="ogretmen"><i data-lucide="graduation-cap"></i>Öğretmenler</button>
    <button data-s="basvuru"><i data-lucide="award"></i>Başvurular</button>
    <button data-s="daha"><i data-lucide="menu"></i>Daha fazla</button>
  </nav>
</div>

<dialog id="sifre-dlg"><form method="dialog" id="sifre-form">
  <h3>Şifre değiştir</h3>
  <label>Yeni şifre (en az 10 karakter)<input type="password" id="yeni-sifre" minlength="10" required></label>
  <div class="dlg-alt"><button value="iptal" formnovalidate class="ince">Vazgeç</button><button class="birincil kucuk" id="sifre-kaydet" value="ok">Kaydet</button></div>
  <div class="hata-satir" id="s-hata"></div>
</form></dialog>

<div id="buyut" hidden><img alt=""></div>
<div id="toastlar"></div>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js" integrity="sha384-ieG+IKD0d/ZPXyCBTMVAbqsQdns8QGJR/e26WMw7M4fkaI/rHcS/YIoi+ah9WGge" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
