<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Destek Paneli · Tahta</title>
<link rel="stylesheet" href="stil.css">
</head>
<body>
<div id="giris" hidden>
  <form class="giris-kutu kart" id="giris-form">
    <div class="giris-ust"><img src="logo.png" alt="TAHTA" class="giris-logo"><h1>Destek Paneli</h1><p>Yetkili hesabınla giriş yap.</p></div>
    <label>E-posta<input type="email" id="g-eposta" autocomplete="username" required></label>
    <label>Şifre<input type="password" id="g-sifre" autocomplete="current-password" required></label>
    <button class="birincil tam" type="submit">Giriş Yap</button>
    <div class="hata-satir" id="g-hata"></div>
  </form>
</div>

<div id="uygulama" hidden>
  <button class="menu-ac" id="menu-ac" aria-label="Menüyü aç"><i data-lucide="menu"></i></button>
  <div class="perde" id="perde" hidden></div>
  <aside class="yan" id="yan">
    <div class="yan-ust">
      <img src="logo-white.png" alt="TAHTA" class="yan-logo">
      <p class="yan-ad" id="k-ad"></p>
      <span class="yan-rol" id="k-rol">Destek</span>
    </div>
    <nav id="sekmeler">
      <button data-s="ozet"><i data-lucide="layout-dashboard"></i>Özet</button>
      <button data-s="gunluk"><i data-lucide="bar-chart-3"></i>Günlük</button>
      <div class="grup" data-grup="sikayet">
        <button class="grup-bas"><span><i data-lucide="inbox"></i>Şikayetler<b class="rozet grup-rozet" id="r-sikayet-grup"></b></span><i data-lucide="chevron-down" class="ok"></i></button>
        <div class="grup-ic">
          <button data-s="bekleyen">Kararını Bekleyenler<b class="rozet" id="r-bekleyen"></b></button>
          <button data-s="kontrol">Haftalık Kontrol<b class="rozet" id="r-kontrol"></b></button>
          <button data-s="sikayet">Tüm Şikayetler</button>
        </div>
      </div>
      <div class="grup" data-grup="ogretmen">
        <button class="grup-bas"><span><i data-lucide="graduation-cap"></i>Öğretmenler<b class="rozet grup-rozet" id="r-ogretmen-grup"></b></span><i data-lucide="chevron-down" class="ok"></i></button>
        <div class="grup-ic">
          <button data-s="ogretmen">Öğretmen Listesi</button>
          <button data-s="uyari">Uyarılar<b class="rozet" id="r-uyari"></b></button>
          <button data-s="takip">Yakın Takip</button>
          <button data-s="eksi">Eksi Puanlılar</button>
        </div>
      </div>
      <button data-s="basvuru"><i data-lucide="award"></i>Solver Başvuruları</button>
      <button data-s="ogrenci"><i data-lucide="users"></i>Öğrenciler</button>
    </nav>
    <div class="yan-alt">
      <button class="yan-alt-btn" id="sifre-btn"><i data-lucide="key-round"></i>Şifre Değiştir</button>
      <button class="yan-alt-btn" id="cikis"><i data-lucide="log-out"></i>Çıkış Yap</button>
    </div>
  </aside>
  <main id="icerik"></main>
</div>

<dialog id="sifre-dlg"><form method="dialog" id="sifre-form">
  <h3>Şifre değiştir</h3>
  <label>Yeni şifre (en az 10 karakter)<input type="password" id="yeni-sifre" minlength="10" required></label>
  <div class="dlg-alt"><button value="iptal" formnovalidate class="ince">Vazgeç</button><button class="birincil kucuk" id="sifre-kaydet" value="ok">Kaydet</button></div>
  <div class="hata-satir" id="s-hata"></div>
</form></dialog>

<div id="buyut" hidden><img alt=""></div>
<div id="toastlar"></div>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
